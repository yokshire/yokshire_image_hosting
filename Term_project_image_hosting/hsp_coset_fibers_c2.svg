<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <rect width="1800" height="760" fill="#fbfbf8"/>
  <text x="900" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1f2933">Oracle-output fibers for f_2(g)=g(2)</text>
  <text x="900" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52606d">Each fiber contains four elements and is one right coset of H_2 = {(0,1), (3,2), (1,3), (4,4)}</text>
  <defs>
    <style>
      .panel{stroke:#253858;stroke-width:3;rx:16;fill:white;}
      .head{font-family:Arial, Helvetica, sans-serif;font-size:27px;font-weight:700;fill:#102a43;}
      .sub{font-family:Arial, Helvetica, sans-serif;font-size:19px;fill:#486581;}
      .elem{font-family:Consolas, Menlo, monospace;font-size:25px;fill:#1f2933;}
      .pill{stroke-width:2;rx:12;}
    </style>
  </defs>
  <g transform="translate(55 135)">
    <rect class="panel" x="0" y="0" width="320" height="520"/>
    <rect x="0" y="0" width="320" height="82" rx="16" fill="#dbeafe"/>
    <text class="head" x="160" y="38" text-anchor="middle">f_2(g)=0</text>
    <text class="sub" x="160" y="66" text-anchor="middle">right coset</text>
    <rect class="pill" x="45" y="128" width="230" height="52" fill="#eff6ff" stroke="#60a5fa"/><text class="elem" x="160" y="162" text-anchor="middle">(1,2)</text>
    <rect class="pill" x="45" y="208" width="230" height="52" fill="#eff6ff" stroke="#60a5fa"/><text class="elem" x="160" y="242" text-anchor="middle">(2,4)</text>
    <rect class="pill" x="45" y="288" width="230" height="52" fill="#eff6ff" stroke="#60a5fa"/><text class="elem" x="160" y="322" text-anchor="middle">(3,1)</text>
    <rect class="pill" x="45" y="368" width="230" height="52" fill="#eff6ff" stroke="#60a5fa"/><text class="elem" x="160" y="402" text-anchor="middle">(4,3)</text>
  </g>
  <g transform="translate(395 135)">
    <rect class="panel" x="0" y="0" width="320" height="520"/>
    <rect x="0" y="0" width="320" height="82" rx="16" fill="#dcfce7"/>
    <text class="head" x="160" y="38" text-anchor="middle">f_2(g)=1</text>
    <text class="sub" x="160" y="66" text-anchor="middle">right coset</text>
    <rect class="pill" x="45" y="128" width="230" height="52" fill="#f0fdf4" stroke="#4ade80"/><text class="elem" x="160" y="162" text-anchor="middle">(0,3)</text>
    <rect class="pill" x="45" y="208" width="230" height="52" fill="#f0fdf4" stroke="#4ade80"/><text class="elem" x="160" y="242" text-anchor="middle">(2,2)</text>
    <rect class="pill" x="45" y="288" width="230" height="52" fill="#f0fdf4" stroke="#4ade80"/><text class="elem" x="160" y="322" text-anchor="middle">(3,4)</text>
    <rect class="pill" x="45" y="368" width="230" height="52" fill="#f0fdf4" stroke="#4ade80"/><text class="elem" x="160" y="402" text-anchor="middle">(4,1)</text>
  </g>
  <g transform="translate(735 135)">
    <rect class="panel" x="0" y="0" width="320" height="520"/>
    <rect x="0" y="0" width="320" height="82" rx="16" fill="#fef3c7"/>
    <text class="head" x="160" y="38" text-anchor="middle">f_2(g)=2</text>
    <text class="sub" x="160" y="66" text-anchor="middle">stabilizer H_2</text>
    <rect class="pill" x="45" y="128" width="230" height="52" fill="#fffbeb" stroke="#f59e0b"/><text class="elem" x="160" y="162" text-anchor="middle">(0,1)</text>
    <rect class="pill" x="45" y="208" width="230" height="52" fill="#fffbeb" stroke="#f59e0b"/><text class="elem" x="160" y="242" text-anchor="middle">(1,3)</text>
    <rect class="pill" x="45" y="288" width="230" height="52" fill="#fffbeb" stroke="#f59e0b"/><text class="elem" x="160" y="322" text-anchor="middle">(3,2)</text>
    <rect class="pill" x="45" y="368" width="230" height="52" fill="#fffbeb" stroke="#f59e0b"/><text class="elem" x="160" y="402" text-anchor="middle">(4,4)</text>
  </g>
  <g transform="translate(1075 135)">
    <rect class="panel" x="0" y="0" width="320" height="520"/>
    <rect x="0" y="0" width="320" height="82" rx="16" fill="#ede9fe"/>
    <text class="head" x="160" y="38" text-anchor="middle">f_2(g)=3</text>
    <text class="sub" x="160" y="66" text-anchor="middle">right coset</text>
    <rect class="pill" x="45" y="128" width="230" height="52" fill="#f5f3ff" stroke="#a78bfa"/><text class="elem" x="160" y="162" text-anchor="middle">(0,4)</text>
    <rect class="pill" x="45" y="208" width="230" height="52" fill="#f5f3ff" stroke="#a78bfa"/><text class="elem" x="160" y="242" text-anchor="middle">(1,1)</text>
    <rect class="pill" x="45" y="288" width="230" height="52" fill="#f5f3ff" stroke="#a78bfa"/><text class="elem" x="160" y="322" text-anchor="middle">(2,3)</text>
    <rect class="pill" x="45" y="368" width="230" height="52" fill="#f5f3ff" stroke="#a78bfa"/><text class="elem" x="160" y="402" text-anchor="middle">(4,2)</text>
  </g>
  <g transform="translate(1415 135)">
    <rect class="panel" x="0" y="0" width="320" height="520"/>
    <rect x="0" y="0" width="320" height="82" rx="16" fill="#ffe4e6"/>
    <text class="head" x="160" y="38" text-anchor="middle">f_2(g)=4</text>
    <text class="sub" x="160" y="66" text-anchor="middle">right coset</text>
    <rect class="pill" x="45" y="128" width="230" height="52" fill="#fff1f2" stroke="#fb7185"/><text class="elem" x="160" y="162" text-anchor="middle">(0,2)</text>
    <rect class="pill" x="45" y="208" width="230" height="52" fill="#fff1f2" stroke="#fb7185"/><text class="elem" x="160" y="242" text-anchor="middle">(1,4)</text>
    <rect class="pill" x="45" y="288" width="230" height="52" fill="#fff1f2" stroke="#fb7185"/><text class="elem" x="160" y="322" text-anchor="middle">(2,1)</text>
    <rect class="pill" x="45" y="368" width="230" height="52" fill="#fff1f2" stroke="#fb7185"/><text class="elem" x="160" y="402" text-anchor="middle">(3,3)</text>
  </g>
  <text x="900" y="708" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334e68">The five oracle fibers partition all 20 elements of AGL(1,5).</text>
</svg>
